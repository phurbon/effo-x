            <div class="product-grid" data-source="shopify">
              <shopify-list-context type="product" query="collection.products" first="12">

                  <article class="product-card">
                    <div class="img-wrap">
                      <a class="product__link" onclick="document.getElementById('product-modal').showModal(); document.getElementById('product-modal-context').update(event);">
                        <shopify-media width="450" height="450" query="product.featuredImage"></shopify-media>
                      </a>
                    </div>
                    <div class="meta">
                      <h3 class="brand">
                        <a class="product__link" onclick="document.getElementById('product-modal').showModal(); document.getElementById('product-modal-context').update(event);">
                          <shopify-data query="product.title"></shopify-data>
                        </a>
                      </h3>
                      <p class="name"><shopify-data query="product.description"></shopify-data></p>
                      <p class="price"><shopify-money query="product.selectedOrFirstAvailableVariant.price"></shopify-money></p>
                      <div class="badges">
                        <span class="badge"><shopify-data query="product.productType"></shopify-data></span>
                      </div>
                    </div>

    <dialog id="product-modal" class="product-modal" role="dialog" aria-modal="true" aria-labelledby="product-modal-title">
      <shopify-context id="product-modal-context" type="product" wait-for-update>
        <template>
          <div class="product-modal__container">
            <div class="product-modal__close-container">
              <button class="product-modal__close" type="button" aria-label="Close" onclick="document.getElementById('product-modal').close();">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
            <div class="product-modal__content">
              <div class="product-modal__layout">
                <div class="product-modal__media">
                  <div class="modal-gallery" data-modal-gallery>
                    <div class="modal-gallery__main">
                      <img data-modal-main alt="">
                    </div>
                    <div class="modal-gallery__thumbs" data-modal-thumbs></div>
                    <span data-modal-handle hidden><shopify-data query="product.handle"></shopify-data></span>
                  </div>
                </div>
                <div class="product-modal__details">
                  <div class="product-modal__header">
                    <h1 class="product-modal__title" id="product-modal-title">
                      <shopify-data query="product.title"></shopify-data>
                    </h1>
                    <div class="product-modal__price-container">
                      <shopify-money query="product.selectedOrFirstAvailableVariant.price"></shopify-money>
                      <shopify-money class="product-modal__compare-price" query="product.selectedOrFirstAvailableVariant.compareAtPrice"></shopify-money>
                    </div>
                  </div>
                  <shopify-variant-selector></shopify-variant-selector>
                  <div class="product-modal__buttons">
                    <button class="product-modal__add-button" onclick="const cart=document.getElementById('shopify-cart'); cart?.addLine(event); cart?.showModal(); document.getElementById('product-modal').close();" shopify-attr--disabled="!product.selectedOrFirstAvailableVariant.availableForSale">Add to cart</button>
                    <button class="product-modal__buy-button" onclick="document.querySelector('shopify-store')?.buyNow(event)" shopify-attr--disabled="!product.selectedOrFirstAvailableVariant.availableForSale">Buy now</button>
                  </div>
                  <div class="product-modal__description">
                    <span class="product-modal__description-text">
                      <shopify-data query="product.descriptionHtml"></shopify-data>
                    </span>
                  </div>
                </div>
